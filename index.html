<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Kharcha — Local-only bank and credit card statement analyzer. 100% private, offline-first. Your financial documents never leave your device." />
    <meta name="theme-color" content="#09090b" />
    <meta property="og:title" content="Kharcha — Bank Statement Analyzer" />
    <meta property="og:description" content="Local-only, privacy-first bank & credit card statement analyzer for India. Instant tie-out verification, categorization, and analytics." />
    <meta property="og:type" content="website" />
    <title>Kharcha — Statement Analyzer</title>
    <!-- Prevent FOUC: read stored theme or default to system -->
    <script>
      (function() {
        try {
          const stored = localStorage.getItem('kharcha_theme');
          const isDark = stored === 'dark' || (!stored && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (isDark) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (_) {}
      })();
    </script>
  </head>
  <body class="min-h-screen bg-background text-foreground flex flex-col">
    <div id="app" class="flex-1 flex flex-col"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
